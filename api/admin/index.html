<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>博客管理后台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f6f5fb; color: #2c2c2a; padding: 32px 16px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
  .sub { color: #888780; font-size: 13px; margin-bottom: 24px; }
  .card { background: #fff; border: 1px solid #e5e3ef; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  .row { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }
  .row > label { flex-shrink: 0; }
  .row > input { flex: 1 1 140px; min-width: 0; height: 40px; line-height: 22px; }
  .row > .btn { flex-shrink: 0; height: 40px; }
  label { font-size: 13px; color: #5f5e5a; white-space: nowrap; }
  input[type=password], input[type=text], input[type=url], textarea {
    width: 100%; border: 1px solid #d8d5e6; border-radius: 8px; padding: 8px 10px; font-size: 14px; font-family: inherit; background: #fff; color: #2c2c2a;
  }
  input:focus, textarea:focus { outline: none; border-color: #6c5ce7; }
  textarea { min-height: 90px; resize: vertical; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    border: none; border-radius: 8px; padding: 8px 16px; font-size: 14px; font-family: inherit; cursor: pointer; user-select: none; background: #6c5ce7; color: #fff; transition: opacity .15s;
  }
  .btn:hover { opacity: .88; }
  .btn:focus-visible { outline: 2px solid #a29bfe; outline-offset: 1px; }
  .btn.ghost { background: transparent; border: 1px solid #d8d5e6; color: #5f5e5a; }
  .btn.danger { background: #fff; color: #e24b4a; border: 1px solid #f09595; }
  .btn.small { padding: 4px 10px; font-size: 13px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .tab { padding: 8px 18px; border-radius: 999px; border: 1px solid #d8d5e6; background: #fff; color: #5f5e5a; cursor: pointer; font-size: 14px; }
  .tab.active { background: #6c5ce7; border-color: #6c5ce7; color: #fff; }
  .hint { font-size: 13px; color: #888780; }
  .memo { border-bottom: 1px dashed #e5e3ef; padding: 12px 0; }
  .memo:last-child { border-bottom: none; }
  .memo .time { font-size: 12px; color: #a09e97; margin-bottom: 6px; }
  .memo .text { font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; margin-bottom: 6px; }
  .friend { border: 1px solid #e5e3ef; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .friend .info { min-width: 0; }
  .friend .name { font-size: 15px; font-weight: 500; }
  .friend .name a { color: #534ab7; text-decoration: none; }
  .friend .meta { font-size: 13px; color: #888780; margin-top: 2px; word-break: break-all; }
  .friend .btns { display: flex; gap: 6px; flex-shrink: 0; }
  .empty { color: #a09e97; font-size: 14px; padding: 8px 0; }
  .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #2c2c2a; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .err { color: #e24b4a; font-size: 13px; margin-top: 8px; }
  .ok { color: #0f6e56; font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>博客管理后台</h1>
  <p class="sub">动态内容发布 · 友链申请审核</p>

  <div class="card" id="tokenCard">
    <div class="row">
      <label for="token">管理 Token</label>
      <input type="password" id="token" placeholder="输入 ADMIN_TOKEN">
      <div id="saveToken" class="btn" role="button" tabindex="0">保存</div>
    </div>
    <p class="hint">Token 只保存在当前浏览器的 localStorage 中。</p>
  </div>

  <div class="tabs" id="tabs" style="display:none">
    <div class="tab active" data-view="memos" role="button" tabindex="0">动态发布</div>
    <div class="tab" data-view="friends" role="button" tabindex="0">友链审核<span id="pendingBadge" style="display:none"></span></div>
  </div>

  <div class="card" id="view-memos" style="display:none">
    <label for="memoContent">新动态</label>
    <textarea id="memoContent" placeholder="记录点什么……"></textarea>
    <div class="row" style="margin-top:12px;justify-content:space-between">
      <div id="addMemo" class="btn">发布</div>
      <span class="hint" id="memoCount"></span>
    </div>
    <div id="memoList"></div>
  </div>

  <div class="card" id="view-friends" style="display:none">
    <div class="row" style="justify-content:space-between">
      <strong>待审核申请</strong>
      <span class="hint" id="pendingHint"></span>
    </div>
    <div id="pendingList"></div>
    <div class="row" style="justify-content:space-between;margin-top:20px">
      <strong>已通过</strong>
      <span class="hint" id="approvedCount"></span>
    </div>
    <div id="approvedList"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id)
const TOKEN_KEY = 'blog_admin_token'
let token = localStorage.getItem(TOKEN_KEY) || ''

function toast(msg) {
  const el = $('toast')
  el.textContent = msg
  el.classList.add('show')
  clearTimeout(el._t)
  el._t = setTimeout(() => el.classList.remove('show'), 2200)
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
}

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json' }
  if (token) headers.Authorization = 'Bearer ' + token
  const res = await fetch(path, { ...opts, headers })
  if (res.status === 401) {
    token = ''
    localStorage.removeItem(TOKEN_KEY)
    $('tokenCard').style.display = ''
    $('tabs').style.display = 'none'
    $('view-memos').style.display = 'none'
    $('view-friends').style.display = 'none'
    toast('Token 失效，请重新输入')
    throw new Error('unauthorized')
  }
  const data = await res.json().catch(() => ({}))
  if (!res.ok) throw new Error(data.error || ('请求失败 ' + res.status))
  return data
}

function currentView() {
  return document.querySelector('.tab.active').dataset.view
}

function switchView(view) {
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.view === view))
  $('view-memos').style.display = view === 'memos' ? '' : 'none'
  $('view-friends').style.display = view === 'friends' ? '' : 'none'
  if (view === 'memos') loadMemos()
  else loadFriends()
}

/* ---- 动态 ---- */
async function loadMemos() {
  const list = $('memoList')
  try {
    const memos = await api('/api/admin/memos')
    $('memoCount').textContent = memos.length ? `共 ${memos.length} 条` : ''
    if (!memos.length) {
      list.innerHTML = '<div class="empty">还没有动态，发第一条吧。</div>'
      return
    }
    list.innerHTML = memos.map(m => `
      <div class="memo">
        <div class="time">${esc(m.created_at.replace('T', ' ').slice(0, 16))}</div>
        <div class="text">${esc(m.content)}</div>
        <div class="btn small danger" onclick="delMemo(${m.id})">删除</div>
      </div>`).join('')
  } catch (e) { if (e.message !== 'unauthorized') toast(e.message) }
}

async function delMemo(id) {
  if (!confirm('确认删除这条动态？')) return
  try {
    await api('/api/admin/memos/' + id, { method: 'DELETE' })
    toast('已删除')
    loadMemos()
  } catch (e) { if (e.message !== 'unauthorized') toast(e.message) }
}

/* ---- 友链 ---- */
async function loadFriends() {
  try {
    const pending = await api('/api/admin/friends?status=pending')
    const approved = await api('/api/admin/friends?status=approved')
    const badge = $('pendingBadge')
    if (pending.length) {
      badge.style.display = 'inline'
      badge.textContent = ` · ${pending.length}`
    } else badge.style.display = 'none'
    $('pendingHint').textContent = pending.length ? `共 ${pending.length} 条待处理` : '暂无待审核申请'
    $('pendingList').innerHTML = pending.length ? pending.map(f => friendCard(f, true)).join('') : '<div class="empty">暂无待审核申请</div>'
    $('approvedCount').textContent = `共 ${approved.length} 个`
    $('approvedList').innerHTML = approved.length ? approved.map(f => friendCard(f, false)).join('') : '<div class="empty">暂无已通过的友链</div>'
  } catch (e) { if (e.message !== 'unauthorized') toast(e.message) }
}

function friendCard(f, actionable) {
  const actions = actionable
    ? `<div class="btns">
         <div class="btn small" onclick="decide(${f.id},'approve')">通过</div>
         <div class="btn small danger" onclick="decide(${f.id},'reject')">拒绝</div>
       </div>`
    : ''
  return `<div class="friend">
    <div class="info">
      <div class="name"><a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a></div>
      <div class="meta">${esc(f.url)}${f.desc ? ' · ' + esc(f.desc) : ''}</div>
      <div class="meta">申请于 ${esc((f.created_at || '').replace('T', ' ').slice(0, 16))}</div>
    </div>${actions}
  </div>`
}

async function decide(id, action) {
  try {
    await api(`/api/admin/friends/${id}/${action}`, { method: 'POST' })
    toast(action === 'approve' ? '已通过，友链即刻生效' : '已拒绝')
    loadFriends()
  } catch (e) { if (e.message !== 'unauthorized') toast(e.message) }
}

/* ---- 事件绑定 ---- */
$('saveToken').addEventListener('click', () => {
  const v = $('token').value.trim()
  if (!v) return toast('请输入 Token')
  token = v
  localStorage.setItem(TOKEN_KEY, v)
  $('tokenCard').style.display = 'none'
  $('tabs').style.display = ''
  switchView('memos')
  toast('已登录')
})
$('token').addEventListener('keydown', e => { if (e.key === 'Enter') $('saveToken').click() })

document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => switchView(b.dataset.view)))

$('addMemo').addEventListener('click', async () => {
  const content = $('memoContent').value.trim()
  if (!content) return toast('写点内容再发布')
  try {
    await api('/api/admin/memos', { method: 'POST', body: JSON.stringify({ content }) })
    $('memoContent').value = ''
    toast('已发布')
    loadMemos()
  } catch (e) { if (e.message !== 'unauthorized') toast(e.message) }
})

if (token) {
  $('tokenCard').style.display = 'none'
  $('tabs').style.display = ''
  switchView('memos')
}
</script>
</body>
</html>

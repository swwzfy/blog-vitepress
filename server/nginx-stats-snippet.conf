# —— nginx.conf 的 http {} 块里加一次（所有 server 共享限流桶定义）——
# 如果已有别的 limit_req_zone，改个名字即可，别重名。
limit_req_zone $binary_remote_addr zone=statsapi:10m rate=5r/s;

# —— 站点的 server {} 块里加（与静态资源的 location 平级）——
location /api/ {
    limit_req zone=statsapi burst=20 nodelay;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header User-Agent $http_user_agent;
}
